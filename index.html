<!-- RETICLE / CROSSHAIR -->
<div id="crosshair">
  <div class="ch-line top"></div>
  <div class="ch-line bottom"></div>
  <div class="ch-line left"></div>
  <div class="ch-line right"></div>
  <div class="ch-dot"></div>
</div>

<!-- HEALTH & SHIELD BARS (BOTTOM LEFT) -->
<div id="vitals-container">
  <div class="bar-label">SHIELD <span id="shield-val">100</span></div>
  <div class="bar-bg">
    <div id="shield-bar" class="bar-fill shield" style="width: 100%;"></div>
  </div>
  <div class="bar-label">HEALTH <span id="hp-val">100</span></div>
  <div class="bar-bg">
    <div id="hp-bar" class="bar-fill hp" style="width: 100%;"></div>
  </div>
</div>

<!-- MATERIAL COUNTERS (BOTTOM RIGHT) -->
<div id="materials-container">
  <div class="mat-item">🪵 WOOD: <span id="wood-cnt">500</span></div>
  <div class="mat-item">🪨 STONE: <span id="stone-cnt">300</span></div>
  <div class="mat-item">⚙️ METAL: <span id="metal-cnt">100</span></div>
</div>

<!-- WEAPON HOTBAR (BOTTOM CENTER) -->
<div id="hotbar">
  <div class="slot active" id="slot-1">1: Pickaxe</div>
  <div class="slot" id="slot-2">2: AR</div>
  <div class="slot" id="slot-3">3: Shotgun</div>
  <div class="slot" id="slot-4">4: Sniper</div>
  <div class="slot" id="slot-5">5: Mini Shield</div>
</div>

<!-- CONTROLS GUIDE (TOP LEFT) -->
<div id="controls-hint">
  <strong>CONTROLS:</strong><br>
  WASD: Walk &amp; Move<br>
  Mouse: Look / Aim<br>
  Left Click: Shoot / Harvest<br>
  1-5: Swap Weapon<br>
  Space: Jump
</div>
